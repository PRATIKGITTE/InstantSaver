<svg width="600" height="420" viewBox="0 0 600 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="cardClip"><rect x="60" y="30" width="480" height="360" rx="18"/></clipPath>
  </defs>

  <!-- soft background blobs -->
  <circle cx="60" cy="50" r="90" fill="#e0eafc"/>
  <circle cx="560" cy="380" r="110" fill="#eef2ff"/>

  <!-- phone/post card -->
  <rect x="60" y="30" width="480" height="360" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>

  <g clip-path="url(#cardClip)">
    <!-- header bar -->
    <circle cx="90" cy="60" r="14" fill="#c7d2fe"/>
    <rect x="112" y="53" width="90" height="8" rx="4" fill="#d1d5db"/>
    <rect x="112" y="65" width="60" height="6" rx="3" fill="#e5e7eb"/>
    <circle cx="520" cy="60" r="3" fill="#9ca3af"/>
    <circle cx="508" cy="60" r="3" fill="#9ca3af"/>
    <circle cx="496" cy="60" r="3" fill="#9ca3af"/>

    <!-- media placeholder -->
    <rect x="60" y="92" width="480" height="180" fill="#eef1f8"/>
    <polygon points="285,160 285,205 325,182" fill="#c7d2fe"/>

    <!-- caption lines -->
    <rect x="80" y="288" width="260" height="8" rx="4" fill="#e5e7eb"/>
    <rect x="80" y="304" width="180" height="8" rx="4" fill="#e5e7eb"/>

    <!-- action icons row -->
    <rect x="80" y="330" width="22" height="22" rx="4" fill="#fca5a5"/>
    <rect x="112" y="330" width="22" height="22" rx="4" fill="#bbf7d0"/>
    <rect x="460" y="330" width="22" height="22" rx="4" fill="#c7d2fe"/>
  </g>

  <!-- dropdown menu overlay -->
  <g>
    <rect x="300" y="140" width="190" height="150" rx="14" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="drop-shadow(0 6px 14px rgba(0,0,0,0.12))"/>
    <rect x="320" y="162" width="110" height="9" rx="4" fill="#e5e7eb"/>
    <rect x="320" y="188" width="90" height="9" rx="4" fill="#e5e7eb"/>

    <!-- highlighted "Copy Link" row -->
    <rect x="310" y="208" width="170" height="30" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="325" y="228" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#4f46e5">Copy Link</text>

    <rect x="320" y="250" width="70" height="9" rx="4" fill="#e5e7eb"/>
  </g>

  <!-- step 1 callout: tap the menu -->
  <circle cx="470" cy="150" r="16" fill="#4f46e5"/>
  <text x="470" y="155" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <path d="M470 166 C470 180, 500 150, 508 140" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- step 2 callout: copy link row -->
  <circle cx="300" cy="223" r="16" fill="#15803d"/>
  <text x="300" y="228" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4f46e5"/>
    </marker>
  </defs>
</svg>
