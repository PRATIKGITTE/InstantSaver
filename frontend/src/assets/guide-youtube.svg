<svg width="600" height="420" viewBox="0 0 600 420" xmlns="http://www.w3.org/2000/svg">
  <!-- soft background blobs -->
  <circle cx="550" cy="40" r="90" fill="#fee2e2"/>
  <circle cx="40" cy="390" r="100" fill="#e0eafc"/>

  <!-- app window card -->
  <rect x="60" y="30" width="480" height="360" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- window chrome dots -->
  <circle cx="84" cy="54" r="5" fill="#fca5a5"/>
  <circle cx="100" cy="54" r="5" fill="#fde68a"/>
  <circle cx="116" cy="54" r="5" fill="#bbf7d0"/>

  <!-- brand mark -->
  <rect x="270" y="46" width="22" height="22" rx="6" fill="#4f46e5"/>
  <text x="298" y="63" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#111827">InstantSaver</text>

  <!-- tab pills -->
  <rect x="216" y="84" width="76" height="26" rx="13" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="254" y="101" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#374151" text-anchor="middle">Instagram</text>
  <rect x="300" y="84" width="64" height="26" rx="13" fill="#dc2626"/>
  <text x="332" y="101" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">YouTube</text>

  <!-- input row -->
  <rect x="90" y="130" width="300" height="40" rx="12" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
  <text x="106" y="155" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af">Paste YouTube link here…</text>
  <rect x="400" y="130" width="90" height="40" rx="12" fill="#2563eb"/>
  <text x="445" y="155" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Preview</text>

  <!-- video result card -->
  <rect x="90" y="196" width="230" height="130" rx="12" fill="#111827"/>
  <circle cx="205" cy="261" r="26" fill="#dc2626"/>
  <polygon points="197,249 197,273 220,261" fill="#fff"/>

  <rect x="330" y="200" width="160" height="10" rx="5" fill="#e5e7eb"/>
  <rect x="330" y="218" width="120" height="10" rx="5" fill="#e5e7eb"/>

  <!-- quality pills -->
  <rect x="330" y="244" width="46" height="22" rx="11" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="353" y="259" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#4f46e5" text-anchor="middle">720p</text>
  <rect x="382" y="244" width="46" height="22" rx="11" fill="#4f46e5"/>
  <text x="405" y="259" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">1080p</text>

  <rect x="90" y="340" width="130" height="34" rx="10" fill="#15803d"/>
  <text x="155" y="362" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Download</text>

  <rect x="232" y="340" width="110" height="34" rx="10" fill="#8b5cf6"/>
  <text x="287" y="362" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Audio M4A</text>

  <!-- step callouts -->
  <circle cx="86" cy="130" r="17" fill="#dc2626"/>
  <text x="86" y="135" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text>

  <circle cx="494" cy="130" r="17" fill="#2563eb"/>
  <text x="494" y="135" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text>

  <circle cx="94" cy="376" r="17" fill="#15803d"/>
  <text x="94" y="381" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3</text>
</svg>
