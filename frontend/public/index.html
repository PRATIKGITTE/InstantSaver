<!DOCTYPE html>

<head>

  <!-- ================= CORE ================= -->
  <meta charset="utf-8" />

  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- Pre-hydration fallback title only — react-helmet replaces the single <title> node
       in place once React mounts, so this is safe to leave as a fallback. Its
       <meta name="description"> counterpart used to live here too, but meta tags don't
       get replaced the same way (react-helmet only manages tags it creates, so it just
       appended a second one) — every route now supplies its own via Helmet instead,
       with nothing static to conflict with (see App.js's HomeSeoTags, SeoPage.js, etc). -->
  <title>Instagram Downloader — Download Reels, Photos, Carousel, Videos Free | InstantSaver</title>

  <meta name="keywords"
    content="instagram downloader, instagram reels downloader, download instagram photos, instagram carousel downloader, instagram video downloader, download instagram reels, reels saver, free instagram downloader, no watermark" />

  <meta name="robots"
    content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

  <!-- ================= FAVICONS / LOGO ================= -->
  <link rel="icon" type="image/png" sizes="32x32" href="/logo-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/logo-512.png" />

  <meta name="theme-color" content="#6366f1" />

  <!-- ================= PWA MANIFEST ================= -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="InstantSaver" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- ================= LANGUAGE ================= -->
  <!-- NOTE: canonical + hreflang tags used to be hardcoded here too, but this file is
       served identically for EVERY client-side route (CRA + react-router), so a static
       homepage-only canonical became a permanent duplicate that beat each route's own
       react-helmet-injected canonical (react-helmet only manages tags it creates itself
       — it never removes this file's static ones). Each route now supplies its own
       canonical/hreflang via Helmet instead (see App.js's HomeSeoTags, SeoPage.js,
       About.js, etc.) — exactly one canonical per route, no static conflict. -->
  <meta http-equiv="content-language" content="en" />

  <!-- ================= OPEN GRAPH ================= -->
  <meta property="og:site_name" content="InstantSaver" />
  <meta property="og:type" content="website" />

  <meta property="og:image:height" content="630" />

  <!-- ================= TWITTER ================= -->
  <meta name="twitter:card" content="summary_large_image" />

       being rendered. Do not add it back here unconditionally. -->

  <!-- ================= STRUCTURED DATA ================= -->

</head>
